<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Agents — Admin Dashboard</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <style>
        * { box-sizing: border-box; }
        body { 
            transition: background-color 0.3s, color 0.3s; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 dark:text-gray-200 min-h-screen flex">

<!-- ============================================================
     SIDEBAR
     ============================================================ -->
<aside id="sidebar"
       class="fixed inset-y-0 left-0 w-64 bg-white dark:bg-gray-800 shadow-xl transform -translate-x-full transition-transform duration-300 z-50 md:translate-x-0 md:static md:shadow-lg p-6 flex flex-col justify-between">
    <div class="space-y-6">
        <h2 class="text-2xl font-bold dark:text-white flex items-center gap-2"><span>🤖</span> Star Agents</h2>
        <nav class="space-y-2">
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg bg-blue-600 text-white font-semibold shadow-sm transition-colors">
                <i class="fas fa-chart-pie w-5 text-center"></i> Dashboard
            </a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                <i class="fas fa-users w-5 text-center"></i> Users
            </a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                <i class="fas fa-robot w-5 text-center"></i> Agents
            </a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                <i class="fas fa-shopping-cart w-5 text-center"></i> Purchases
            </a>
        </nav>
    </div>
    <div class="space-y-3">
        <button onclick="toggleTheme()" class="w-full flex items-center justify-center gap-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 p-3 rounded-lg transition-colors text-sm font-medium">
            <i class="fas fa-moon"></i> Перемкнути тему
        </button>
        <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 text-white p-3 rounded-lg transition-colors font-medium">
            <i class="fas fa-sign-out-alt"></i> Вийти
        </button>
    </div>
</aside>

<!-- ============================================================
     MAIN CONTENT
     ============================================================ -->
<div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white dark:bg-gray-800 shadow p-4 flex justify-between items-center md:hidden">
        <button onclick="toggleSidebar()" class="text-2xl p-1">☰</button>
        <span class="font-bold">Star Agents</span>
        <button onclick="toggleTheme()" class="text-xl p-1">🌙</button>
    </header>

    <main class="flex-1 p-4 md:p-8">

        <!-- ============================================================
             LOGIN BOX
             ============================================================ -->
        <div id="login-box" class="max-w-md mx-auto mt-16 bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-100 dark:border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-center">Вхід в панель</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email / Логін</label>
                    <input id="email" type="text" placeholder="admin@example.com" value="admin@example.com"
                           class="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Пароль</label>
                    <input id="password" type="password" placeholder="••••••••" value="admin123"
                           class="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
                </div>
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-3 rounded-lg transition-colors shadow flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> Увійти
                </button>
                <p id="login-status" class="text-red-500 text-sm text-center font-medium"></p>
            </div>
        </div>

        <!-- ============================================================
             DASHBOARD
             ============================================================ -->
        <div id="dashboard" class="hidden space-y-8 max-w-7xl mx-auto">

            <!-- KPI CARDS -->
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6">
                <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700 card-hover fade-in">
                    <div class="flex items-center gap-3 text-gray-500 dark:text-gray-400"><i class="fas fa-envelope text-blue-500 text-lg"></i><h3 class="text-sm font-medium">Запити</h3></div>
                    <p id="kpi_requests" class="text-2xl md:text-3xl font-bold mt-2">0</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700 card-hover fade-in">
                    <div class="flex items-center gap-3 text-gray-500 dark:text-gray-400"><i class="fas fa-clock text-green-500 text-lg"></i><h3 class="text-sm font-medium">Сер. час</h3></div>
                    <p id="kpi_duration" class="text-2xl md:text-3xl font-bold mt-2">0.00с</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700 card-hover fade-in">
                    <div class="flex items-center gap-3 text-gray-500 dark:text-gray-400"><i class="fas fa-exclamation-triangle text-red-500 text-lg"></i><h3 class="text-sm font-medium">Помилки</h3></div>
                    <p id="kpi_errors" class="text-2xl md:text-3xl font-bold mt-2 text-red-500">0</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700 card-hover fade-in">
                    <div class="flex items-center gap-3 text-gray-500 dark:text-gray-400"><i class="fas fa-users text-purple-500 text-lg"></i><h3 class="text-sm font-medium">Користувачі</h3></div>
                    <p id="kpi_users" class="text-2xl md:text-3xl font-bold mt-2">0</p>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700 card-hover fade-in">
                    <div class="flex items-center gap-3 text-gray-500 dark:text-gray-400"><i class="fas fa-dollar-sign text-emerald-500 text-lg"></i><h3 class="text-sm font-medium">Виручка</h3></div>
                    <p id="kpi_revenue" class="text-2xl md:text-3xl font-bold mt-2">0 ₴</p>
                </div>
            </div>

            <!-- CHARTS -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700">
                    <h3 class="text-lg font-semibold mb-4"><i class="fas fa-chart-line mr-2 text-blue-500"></i>Динаміка запитів</h3>
                    <div class="relative h-56 md:h-64"><canvas id="chart_timeline"></canvas></div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700">
                    <h3 class="text-lg font-semibold mb-4"><i class="fas fa-chart-pie mr-2 text-purple-500"></i>Розподіл намірів</h3>
                    <div class="relative h-56 md:h-64 flex justify-center"><canvas id="chart_intents"></canvas></div>
                </div>
            </div>

            <!-- TABLES & LIVE FEED -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700">
                    <h3 class="text-lg font-semibold mb-4"><i class="fas fa-trophy mr-2 text-yellow-500"></i>Top Agents</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b dark:border-gray-700 text-xs md:text-sm text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                    <th class="pb-3 px-2 font-medium">Agent</th>
                                    <th class="pb-3 px-2 font-medium text-center">Count</th>
                                    <th class="pb-3 px-2 font-medium text-right">Revenue</th>
                                </tr>
                            </thead>
                            <tbody id="table_top_agents" class="divide-y dark:divide-gray-700 text-sm"></tbody>
                        </table>
                    </div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700">
                    <h3 class="text-lg font-semibold mb-4"><i class="fas fa-bolt mr-2 text-orange-500"></i>Live Feed</h3>
                    <div id="live_feed" class="space-y-2 max-h-64 overflow-y-auto text-sm pr-1"></div>
                </div>
            </div>
            <div id="loading-indicator" class="text-center text-gray-400 text-sm hidden"><i class="fas fa-spinner fa-spin mr-2"></i> Оновлення...</div>
        </div>
    </main>
</div>

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
const API_BASE = "";
let mainChart = null, intentChart = null, refreshInterval = null, isRefreshing = false;

function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    localStorage.setItem("theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
}
if (localStorage.getItem("theme") === "light") document.documentElement.classList.remove("dark");

document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("access_token")) showDashboard();
});

function authHeaders() {
    const token = localStorage.getItem("access_token");
    return { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
}

async function login() {
    const email = document.getElementById("email").value.trim(), password = document.getElementById("password").value;
    const statusEl = document.getElementById("login-status"), btn = document.querySelector("#login-box button");
    statusEl.textContent = "";
    if (!email || !password) { statusEl.textContent = "Введіть email і пароль"; return; }
    btn.disabled = true; btn.innerHTML = `<span class="loader"></span> Входимо...`;
    try {
        const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: new URLSearchParams({ grant_type: "password", username: email, password: password })
        });
        if (!res.ok) { statusEl.textContent = "Невірний логін або пароль"; return; }
        const data = await res.json();
        if (data.access_token) { localStorage.setItem("access_token", data.access_token); showDashboard(); }
        else { statusEl.textContent = "Помилка авторизації"; }
    } catch (e) { statusEl.textContent = "Помилка з'єднання з сервером"; console.error("Login error:", e); }
    finally { btn.disabled = false; btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Увійти`; }
}

function logout() { localStorage.removeItem("access_token"); if (refreshInterval) clearInterval(refreshInterval); location.reload(); }

function showDashboard() {
    document.getElementById("login-box").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    loadDashboard();
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => { if (localStorage.getItem("access_token")) loadDashboard(); }, 5000);
}

async function loadDashboard() {
    if (isRefreshing) return; isRefreshing = true;
    const indicator = document.getElementById("loading-indicator");
    if (indicator) indicator.classList.remove("hidden");
    try {
        let res = await fetch(`${API_BASE}/api/dashboard`, { headers: authHeaders() });
        if (!res.ok) res = await fetch(`${API_BASE}/api/analytics/dashboard`, { headers: authHeaders() });
        if (res.status === 401 || res.status === 403) { logout(); return; }
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        const data = await res.json();

        // 🟢 ФІНАЛЬНЕ ВИПРАВЛЕННЯ: тепер файл лежить у корені проєкту
        try {
            const response = await fetch('/timeline_data.json');
            if (response.ok) {
                const timelineData = await response.json();
                data.timeline = timelineData;
                console.log("✅ Графік завантажено з timeline_data.json");
            }
        } catch (err) {
            console.warn("⚠️ Не вдалося завантажити timeline_data.json, використовуємо дані з API");
        }

        document.getElementById("kpi_requests").textContent = data.requests ?? 0;
        document.getElementById("kpi_duration").textContent = (data.avg_time ?? 0).toFixed(2);
        document.getElementById("kpi_errors").textContent = data.errors ?? 0;
        document.getElementById("kpi_users").textContent = data.users ?? 0;
        document.getElementById("kpi_revenue").textContent = (data.revenue ?? 0).toLocaleString('uk-UA') + ' ₴';

        renderTables(data);
        renderCharts(data);
        renderLiveFeed(data.recent_messages || data.top_users || []);

    } catch (err) { console.error("Dashboard load error:", err);
        const feed = document.getElementById("live_feed");
        if (feed) feed.innerHTML = `<p class="text-red-500 text-sm">❌ Помилка завантаження: ${err.message}</p>`;
    } finally { isRefreshing = false; if (indicator) indicator.classList.add("hidden"); }
}

function renderTables(data) {
    const agentsTable = document.getElementById("table_top_agents");
    const agents = data.top_agents || [];
    agentsTable.innerHTML = agents.length ? agents.map((a, i) => `
        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors ${i === 0 ? 'bg-yellow-50 dark:bg-yellow-900/10' : ''}">
            <td class="py-3 px-2 font-medium flex items-center gap-2">${i === 0 ? '🏆' : ''} ${escapeHtml(a.agent)}</td>
            <td class="py-3 px-2 text-center text-gray-600 dark:text-gray-300">${a.count}</td>
            <td class="py-3 px-2 text-right font-semibold text-emerald-600 dark:text-emerald-400">${typeof a.revenue === 'number' ? a.revenue.toLocaleString('uk-UA') : a.revenue} ₴</td>
        </tr>
    `).join("") : `<tr><td colspan="3" class="py-4 text-center text-gray-500">Немає даних</td></tr>`;
}

function renderCharts(data) {
    // 1. Timeline Chart (СТОВПЧИКОВИЙ ГРАФІК З НЕОНОВИМ ЕФЕКТОМ)
    const ctxMain = document.getElementById("chart_timeline").getContext("2d");
    if (mainChart) mainChart.destroy();

    const timeline = data.timeline || [];
    const fullLabels = [], fullValues = [];

    for (let i = 23; i >= 0; i--) {
        const hour = `${String(i).padStart(2, '0')}:00`;
        const found = timeline.find(t => String(t.hour).trim() === hour);
        fullLabels.push(hour);
        fullValues.push(found ? found.count : 0);
    }

    const maxVal = Math.max(...fullValues, 1);

    mainChart = new Chart(ctxMain, {
        type: "bar",
        data: { 
            labels: fullLabels.length ? fullLabels : ["Немає даних"], 
            datasets: [{ 
                label: "Запити", 
                data: fullValues.length ? fullValues : [0], 
                backgroundColor: "rgba(59, 130, 246, 0.7)",
                borderColor: "#3B82F6",
                borderWidth: 2,
                borderRadius: 6,
                borderSkipped: false,
                hoverBackgroundColor: "#2563EB",
            }] 
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { 
                legend: { display: false }, 
                tooltip: { 
                    callbacks: { 
                        label: (ctx) => `${ctx.parsed.y} запитів` 
                    } 
                } 
            }, 
            scales: { 
                y: { 
                    beginAtZero: true, 
                    max: Math.max(maxVal + 1, 6),
                    ticks: { 
                        stepSize: 1,
                        precision: 0,
                        maxTicksLimit: 10
                    } 
                }, 
                x: { 
                    ticks: { maxTicksLimit: 12 } 
                } 
            } 
        }
    });

    // 2. Intents Chart (Doughnut)
    const ctxIntent = document.getElementById("chart_intents").getContext("2d");
    if (intentChart) intentChart.destroy();
    
    const intents = data.intents_distribution || data.intents || {};
    const labels_int = Object.keys(intents);
    const values_int = Object.values(intents);
    
    const colorsObj = data.intents_colors || {};
    let backgroundColors = [];
    
    if (Object.keys(colorsObj).length > 0) {
        backgroundColors = labels_int.map(label => colorsObj[label]?.color || "#9CA3AF");
    } else {
        const defaultColors = ["#EC4899", "#8B5CF6", "#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#6366F1", "#14B8A6"];
        backgroundColors = labels_int.length ? defaultColors.slice(0, labels_int.length) : ["#9CA3AF"];
    }

    intentChart = new Chart(ctxIntent, {
        type: "doughnut",
        data: { 
            labels: labels_int.length ? labels_int : ["Немає даних"], 
            datasets: [{ 
                data: labels_int.length ? values_int : [1], 
                backgroundColor: backgroundColors, 
                borderWidth: 2, 
                borderColor: document.documentElement.classList.contains("dark") ? "#1F2937" : "#FFFFFF", 
            }] 
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { 
                legend: { 
                    position: "bottom", 
                    labels: { 
                        boxWidth: 12, 
                        padding: 12, 
                        color: document.documentElement.classList.contains("dark") ? "#E5E7EB" : "#1F2937" 
                    } 
                } 
            } 
        }
    });
}

function renderLiveFeed(messages) {
    const container = document.getElementById("live_feed");
    if (!messages || !messages.length) {
        container.innerHTML = `<p class="text-gray-500 text-sm text-center py-4"><i class="fas fa-inbox mr-2"></i>Немає активності</p>`;
        return;
    }
    container.innerHTML = messages.slice(0, 10).map(msg => {
        const text = msg.content || msg.message || msg.text || msg.body || msg.user || "Нове повідомлення";
        const time = msg.time || msg.created_at || "";
        return `
        <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-700/30 px-2 rounded-lg transition-colors">
            <span class="truncate max-w-[160px] text-sm">${escapeHtml(text)}</span>
            <span class="text-xs text-gray-400 whitespace-nowrap ml-2">${time}</span>
        </div>
    `}).join("");
}

function toggleSidebar() { document.getElementById("sidebar").classList.toggle("-translate-x-full"); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
</script>
</body>
</html>
